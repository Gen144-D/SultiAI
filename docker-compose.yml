version: '3.8'

services:
  # Node.js Backend API. Also runs the acoustic pronunciation analysis in
  # process (MFCC, pitch, formants) via ffmpeg-static, so there is no separate
  # AI/scoring service to build or run.
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: sultiai-server
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - server-uploads:/app/uploads
    networks:
      - sultiai-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Next.js Web App
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sultiai-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://server:3001
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - sultiai-network
    depends_on:
      - server

  # Next.js Admin Dashboard
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: sultiai-admin
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      - NEXT_PUBLIC_API_URL=http://server:3001
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - sultiai-network
    depends_on:
      - server

volumes:
  server-uploads:
    driver: local

networks:
  sultiai-network:
    driver: bridge
