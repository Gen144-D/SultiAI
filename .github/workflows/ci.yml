name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Run ESLint (root)
        run: npm run lint

      - name: Run Prettier check (root)
        run: npm run format:check

      - name: Run ESLint (server)
        run: npm run lint
        working-directory: server

      - name: Run Prettier check (server)
        run: npm run format:check
        working-directory: server

      - name: Run ESLint (web)
        run: npm run lint
        working-directory: web

      - name: Run ESLint (admin)
        run: npm run lint
        working-directory: admin

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server tests with coverage
        run: npm run test:coverage
        working-directory: server

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Build admin app
        run: npm run build
        working-directory: admin

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server npm audit
        run: npm audit --audit-level=moderate
        working-directory: server
        continue-on-error: true
